<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Business Prospect Scraper - All Prospects</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="prospects-page">
  <div class="page-container">
    <!-- Header -->
    <header class="page-header">
      <div class="header-content">
        <h1 class="page-title">
          <svg class="title-icon" xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
            <circle cx="9" cy="7" r="4"></circle>
            <path d="M22 21v-2a4 4 0 0 0-3-3.87"></path>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
          </svg>
          Business Prospect Scraper
        </h1>
        <div class="header-stats">
          <span id="total-stats"></span>
        </div>
      </div>
    </header>

    <!-- Filters -->
    <div class="filters-container">
      <div class="filter-group">
        <label for="search-input" class="filter-label">Search</label>
        <div class="search-input-wrapper">
          <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <path d="m21 21-4.35-4.35"></path>
          </svg>
          <input type="text" id="search-input" placeholder="Search by business name..." autocomplete="off">
        </div>
      </div>
      <div class="filter-group">
        <label for="town-filter" class="filter-label">Filter by Location</label>
        <select id="town-filter">
          <option value="all">All Locations</option>
        </select>
      </div>
      <div class="filter-actions">
        <button id="clear-filters" class="btn btn-secondary">Clear Filters</button>
      </div>
    </div>

    <!-- Main Content -->
    <main class="main-content">
      <div id="prospects-container">
        <!-- Prospects will be rendered here -->
      </div>

      <!-- Empty State -->
      <div id="empty-state" class="empty-state-full hidden">
        <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <path d="m21 21-4.35-4.35"></path>
        </svg>
        <h2>No Prospects Found</h2>
        <p id="empty-message">Start by searching for businesses on Google and scanning the page for prospects without websites.</p>
      </div>

      <!-- No Results State -->
      <div id="no-results" class="empty-state-full hidden">
        <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <path d="m21 21-4.35-4.35"></path>
          <line x1="8" y1="8" x2="14" y2="14"></line>
        </svg>
        <h2>No Matching Results</h2>
        <p>Try adjusting your search or filter criteria.</p>
      </div>
    </main>

    <!-- Toast Container -->
    <div id="toast-container"></div>
  </div>

  <script src="prospects.js"></script>
</body>
</html>
