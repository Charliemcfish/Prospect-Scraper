<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Business Prospect Scraper</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="sidepanel">
  <div class="panel-container">
    <!-- Header -->
    <header class="panel-header">
      <h1 class="panel-title">
        <svg class="title-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
          <circle cx="9" cy="7" r="4"></circle>
          <path d="M22 21v-2a4 4 0 0 0-3-3.87"></path>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
        </svg>
        Prospect Scraper
      </h1>
    </header>

    <!-- Summary Stats -->
    <div class="stats-container">
      <div class="stat-box">
        <span class="stat-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
            <circle cx="12" cy="10" r="3"></circle>
          </svg>
        </span>
        <span id="town-count" class="stat-number">0</span>
        <span class="stat-label">towns</span>
      </div>
      <div class="stat-box">
        <span class="stat-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
            <circle cx="9" cy="7" r="4"></circle>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
          </svg>
        </span>
        <span id="prospect-count" class="stat-number">0</span>
        <span class="stat-label">prospects</span>
      </div>
    </div>

    <!-- View All Button -->
    <button id="view-all-btn" class="btn btn-primary btn-full">
      <span>View All Prospects</span>
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
        <polyline points="15 3 21 3 21 9"></polyline>
        <line x1="10" y1="14" x2="21" y2="3"></line>
      </svg>
    </button>

    <!-- Towns List -->
    <div class="towns-container">
      <h2 class="section-title">Prospects by Location</h2>
      <div id="towns-list" class="towns-list">
        <!-- Towns will be inserted here -->
        <div class="empty-state" id="empty-state">
          <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <path d="m21 21-4.35-4.35"></path>
          </svg>
          <p>No prospects yet</p>
          <p class="empty-hint">Search for businesses on Google and click "Scan This Page" to find prospects without websites.</p>
        </div>
      </div>
    </div>

    <!-- Quick Info Panel (shown when clicking a business) -->
    <div id="quick-info" class="quick-info hidden">
      <div class="quick-info-header">
        <h3 id="quick-info-name">Business Name</h3>
        <button id="close-quick-info" class="btn-icon-only" aria-label="Close">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <div class="quick-info-content">
        <div class="info-row">
          <span class="info-label">Phone:</span>
          <span id="quick-info-phone" class="info-value">-</span>
        </div>
        <div class="info-row">
          <span class="info-label">Location:</span>
          <span id="quick-info-location" class="info-value">-</span>
        </div>
        <div class="info-row">
          <span class="info-label">Rating:</span>
          <span id="quick-info-rating" class="info-value">-</span>
        </div>
      </div>
    </div>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
