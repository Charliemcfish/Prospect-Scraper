<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Business Prospect Scraper - Customers</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="prospects-page">
  <div class="page-container">
    <!-- Header -->
    <header class="page-header">
      <div class="header-content">
        <h1 class="page-title">
          <svg class="title-icon" xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
          Converted Customers
        </h1>
        <div class="header-stats" id="total-stats">
          <!-- Stats will be populated by JS -->
        </div>
      </div>
    </header>

    <!-- Navigation Tabs -->
    <nav class="page-nav">
      <a href="prospects.html" class="nav-tab">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
          <circle cx="9" cy="7" r="4"></circle>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
        </svg>
        New Prospects
      </a>
      <a href="contacted.html" class="nav-tab">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72"></path>
        </svg>
        Contacted
      </a>
      <a href="converted.html" class="nav-tab active">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
        Customers
      </a>
    </nav>

    <!-- Filters -->
    <div class="filters-container">
      <div class="filter-group">
        <label for="search-input" class="filter-label">Search</label>
        <div class="search-input-wrapper">
          <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <path d="m21 21-4.35-4.35"></path>
          </svg>
          <input type="text" id="search-input" placeholder="Search by business name..." autocomplete="off">
        </div>
      </div>
      <div class="filter-group">
        <label for="town-filter" class="filter-label">Location</label>
        <select id="town-filter">
          <option value="all">All Locations</option>
        </select>
      </div>
      <div class="filter-actions">
        <button id="clear-filters" class="btn btn-secondary">Clear Filters</button>
      </div>
    </div>

    <!-- Main Content -->
    <main class="main-content">
      <div id="prospects-container">
        <!-- Prospects will be rendered here -->
      </div>

      <!-- Empty State -->
      <div id="empty-state" class="empty-state-full hidden">
        <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
        <h2>No Converted Customers Yet</h2>
        <p>Click the "Converted" button on contacted prospects when they become customers.</p>
      </div>

      <!-- No Results State -->
      <div id="no-results" class="empty-state-full hidden">
        <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <path d="m21 21-4.35-4.35"></path>
        </svg>
        <h2>No Matching Results</h2>
        <p>Try adjusting your search or filter criteria.</p>
      </div>
    </main>

    <!-- Toast Container -->
    <div id="toast-container"></div>
  </div>

  <script src="converted.js"></script>
</body>
</html>
